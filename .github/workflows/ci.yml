name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests
        run: deno run --allow-read tests/run.mjs
      # The commit hook is the gate; this catches one it never saw (--no-verify,
      # a clone without `deno task hooks`). See tasks/adopt-unities.md.
      - name: Compiled record is current
        run: deno run --allow-read scripts/compile-record.mjs --check
      - name: Type-check server
        run: deno task check
        working-directory: server
