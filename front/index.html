<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marky - Markdown Editor</title>
    <meta
      name="description"
      content="A WYSIWYG markdown editor that edits local files through its own file server."
    />
    <meta name="theme-color" content="#2c3e50" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!-- Installable app -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="Marky" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Marky" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- CRITICAL: Theme initialization BEFORE styles load to prevent FOUC -->
    <script>
      (function () {
        // Get saved preference
        const saved = localStorage.getItem("marky-theme");

        // Get system preference
        const systemPrefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;

        // Determine theme
        const theme = saved || (systemPrefersDark ? "dark" : "light");

        // Apply immediately
        document.documentElement.setAttribute("data-theme", theme);

        // Same problem, same slot: outline.js builds the sidebar after the
        // stylesheet has run, so without stamping the state here the editor
        // would render full-width and then shift once the column appeared.
        document.documentElement.setAttribute(
          "data-outline",
          localStorage.getItem("marky-outline") === "open" ? "open" : "closed",
        );
      })();
    </script>

    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="container">
      <!-- Built by toolbar.js from the shared spec, so the app and the
           editable export cannot drift. -->
      <div class="toolbar"></div>

      <div id="formatBar" class="format-bar">
        <button class="format-btn" data-format="p" title="Paragraph">P</button>
        <button class="format-btn" data-format="h1" title="Heading 1">
          H1
        </button>
        <button class="format-btn" data-format="h2" title="Heading 2">
          H2
        </button>
        <button class="format-btn" data-format="h3" title="Heading 3">
          H3
        </button>
        <div class="separator"></div>
        <button class="format-btn" data-format="bold" title="Bold">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
            <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          </svg>
        </button>
        <button class="format-btn" data-format="italic" title="Italic">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="19" y1="4" x2="10" y2="4"></line>
            <line x1="14" y1="20" x2="5" y2="20"></line>
            <line x1="15" y1="4" x2="9" y2="20"></line>
          </svg>
        </button>
        <div class="separator"></div>
        <button class="format-btn" data-format="ul" title="Bullet List">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <circle cx="3" cy="6" r="1" fill="currentColor"></circle>
            <circle cx="3" cy="12" r="1" fill="currentColor"></circle>
            <circle cx="3" cy="18" r="1" fill="currentColor"></circle>
          </svg>
        </button>
        <button class="format-btn" data-format="ol" title="Numbered List">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="10" y1="6" x2="21" y2="6"></line>
            <line x1="10" y1="12" x2="21" y2="12"></line>
            <line x1="10" y1="18" x2="21" y2="18"></line>
            <text x="3" y="8" font-size="8" fill="currentColor">1.</text>
            <text x="3" y="14" font-size="8" fill="currentColor">2.</text>
            <text x="3" y="20" font-size="8" fill="currentColor">3.</text>
          </svg>
        </button>
        <button class="format-btn" data-format="code" title="Code Block">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </button>
      </div>

      <!-- Empty on purpose: the welcome document lives in welcome.md and is
           fetched by app.js when there is nothing saved to restore. -->
      <div id="editor" contenteditable="true" spellcheck="true"></div>
    </div>

    <div id="fileDialog" class="file-dialog">
      <div class="file-dialog-content">
        <div class="file-dialog-header">
          <h2 id="dialogTitle">Open file</h2>
          <button id="dialogClose" class="file-dialog-close" title="Close">
            &times;
          </button>
        </div>
        <div id="dialogPathBar" class="file-dialog-path"></div>
        <div id="dialogEntries" class="file-dialog-entries"></div>
        <div id="dialogSaveRow" class="file-dialog-save-row">
          <input
            type="text"
            id="dialogFilename"
            placeholder="filename.md"
            spellcheck="false"
          />
          <button id="dialogSaveConfirm">Save</button>
        </div>
      </div>
    </div>

    <!-- Always needed: markdown parsing and HTML→markdown conversion.
         Mermaid, MathJax and html2pdf are loaded on demand by lazy-load.js. -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.min.js"></script>

    <!-- toolbar.js first: everything below binds to elements it creates.
         notify.js next: every module below reports its failures through it. -->
    <script src="/toolbar.js"></script>
    <script src="/notify.js"></script>
    <script src="/lazy-load.js"></script>
    <script src="/markdown-style.js"></script>
    <script src="/app.js"></script>
    <script src="/undo.js"></script>
    <script src="/outline.js"></script>
    <script src="/renderers.js"></script>
    <script src="/pdf-export.js"></script>
    <script src="/format-bar.js"></script>
    <script src="/static-export.js"></script>
    <script src="/html-export.js"></script>
    <script src="/file-api.js"></script>

    <script src="/theme-manager.js"></script>

    <script src="/docx-export.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch((error) =>
              console.warn("[SW] Registration failed:", error),
            );
        });
      }
    </script>
  </body>
</html>
